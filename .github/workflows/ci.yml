name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend + AI engine (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pathfinder_test
          POSTGRES_USER: pathfinder
          POSTGRES_PASSWORD: pathfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pathfinder" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt && pip install -e ai-engine
      - name: Lint
        run: ruff check backend/app ai-engine/pathfinder_engine --select E,F,W,B --ignore E501,B008,B904
      - name: AI engine tests
        run: pytest -q ai-engine/tests
      - name: Backend tests (SQLite)
        working-directory: backend
        run: pytest -q
      - name: Backend tests + migrations (PostgreSQL)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pathfinder:pathfinder@localhost:5432/pathfinder_test
        run: pytest -q

  web:
    name: Web (typecheck, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w @pathfinder/web
      - run: npm run test -w @pathfinder/web
      - run: npm run build -w @pathfinder/web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      SKIP_MOBILE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install -r backend/requirements.txt && pip install -e ai-engine
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Start API with demo data
        working-directory: backend
        env: { ENVIRONMENT: test, AUTH_RATE_LIMIT_PER_MINUTE: "200" }
        run: |
          python -m app.cli migrate && python -m app.cli seed --demo
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Start web
        run: nohup npm run dev -w @pathfinder/web > web.log 2>&1 &
      - run: npx wait-on http://localhost:8000/health http://localhost:5173 --timeout 60000
      - run: npm run e2e -w @pathfinder/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results }

  mobile:
    name: Mobile (typecheck, tests, bundle)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - run: npx expo export --platform android --output-dir /tmp/expo-export

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/backend.Dockerfile -t pathfinder-api .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t pathfinder-web .
