# Local / demo stack: PostgreSQL + Redis + API + web.
#   cp .env.example .env   (then set JWT_SECRET and POSTGRES_PASSWORD)
#   docker compose up --build
#   docker compose exec backend python -m app.cli seed --demo   # optional demo data
# Web: http://localhost:8080   API docs: http://localhost:8000/docs
name: pathfinder-ai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pathfinder}
      POSTGRES_USER: ${POSTGRES_USER:-pathfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pathfinder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pathfinder}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /srv/backend/storage
    volumes:
      - uploads:/srv/backend/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  uploads:
